<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin LUMEXI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#10152b;color:#fff;margin:0;padding:20px}.container{max-width:1000px;margin:auto}.painel{background:#191f3d;border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:20px;margin:15px 0}.grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.contador{background:#111831;padding:20px;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,.12)}.contador h2{font-size:36px;margin:0;color:#8caaff}button{border:none;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}.ba{background:#39d98a;color:#000}.br{background:#ff7777;color:#fff}.be{background:transparent;border:1px solid #ff7777;color:#ff7777}.anuncio{background:#111831;border:1px solid rgba(255,255,255,.12);padding:15px;border-radius:12px;margin:10px 0}input{width:100%;padding:12px;background:#10162f;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:white;margin:5px 0}.oculto{display:none!important}</style></head><body><div class="container"><h1>🔐 Admin LUMEXI Angola</h1><div id="loginAdmin" class="painel"><h3>Entrar como Admin</h3><input id="emailAdmin" type="email" placeholder="teu email"><input id="senhaAdmin" type="password" placeholder="palavra-passe"><button style="background:linear-gradient(100deg,#3978ff,#8155ff);color:white;width:100%;margin-top:10px" onclick="loginAdmin()">Entrar</button><p id="msgLogin"></p></div><div id="areaAdmin" class="oculto"><div class="grelha"><div class="contador"><h2 id="cPendente">0</h2><p>Pendentes</p></div><div class="contador"><h2 id="cAprovado">0</h2><p>Aprovados</p></div><div class="contador"><h2 id="cRejeitado">0</h2><p>Rejeitados</p></div><div class="contador"><h2 id="cTotal">0</h2><p>Total</p></div></div><div class="painel"><h3>🕒 Anúncios Pendentes</h3><button onclick="carregarAdmin()" style="background:#293969;color:white">🔄 Atualizar</button><div id="listaPendente"></div></div><div class="painel"><button onclick="logout()" style="background:transparent;border:1px solid rgba(255,255,255,.12);color:white">Sair</button> <a href="index.html" style="color:white;border:1px solid rgba(255,255,255,.12);padding:10px;border-radius:8px;text-decoration:none">Voltar ao site</a></div></div></div><script>const URL="https://vvtunqkbwxbrkyxpfpwp.supabase.co",KEY="sb_publishable_U_AiRZyKSw6i_xRg8FEIAw_vSpmORmc",client=supabase.createClient(URL,KEY);async function loginAdmin(){const e=document.getElementById('emailAdmin').value.trim(),s=document.getElementById('senhaAdmin').value,m=document.getElementById('msgLogin');if(!e||!s){m.textContent="Preencha email e senha";return}m.textContent="A verificar...";const{data,error}=await client.auth.signInWithPassword({email:e,password:s});if(error){m.textContent="Erro: "+error.message;return}document.getElementById('loginAdmin').classList.add('oculto');document.getElementById('areaAdmin').classList.remove('oculto');carregarAdmin()}async function carregarAdmin(){const{data,error}=await client.from('listings').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}document.getElementById('cPendente').textContent=data.filter(a=>a.status==='pending').length;document.getElementById('cAprovado').textContent=data.filter(a=>a.status==='approved').length;document.getElementById('cRejeitado').textContent=data.filter(a=>a.status==='rejected').length;document.getElementById('cTotal').textContent=data.length;const l=document.getElementById('listaPendente');l.innerHTML="";const pend=data.filter(a=>a.status==='pending');if(!pend.length){l.innerHTML="<p>Nenhum pendente 🎉</p>";return}pend.forEach(an=>{const d=document.createElement('div');d.className='anuncio';d.innerHTML=`<h3>${an.title}</h3><p>${an.description}</p><small>${an.category||''} | ${an.location||''}</small><br><button class=ba onclick="upd('${an.id}','approved')">✅ Aprovar</button><button class=br onclick="upd('${an.id}','rejected')">❌ Rejeitar</button><button class=be onclick="del('${an.id}')">🗑️ Eliminar</button>`;l.appendChild(d)})}async function upd(id,st){if(!confirm(st+"?"))return;const{error}=await client.from('listings').update({status:st}).eq('id',id);if(error)alert(error.message);else carregarAdmin()}async function del(id){if(!confirm("Eliminar?"))return;const{error}=await client.from('listings').delete().eq('id',id);if(error)alert(error.message);else carregarAdmin()}async function logout(){await client.auth.signOut();location.reload()}client.auth.getSession().then(({data})=>{if(data.session?.user){document.getElementById('loginAdmin').classList.add('oculto');document.getElementById('areaAdmin').classList.remove('oculto');carregarAdmin()}});</script></body></html>
