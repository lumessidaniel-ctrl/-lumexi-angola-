<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">

  <title>LUMEXI Angola | Oportunidades que transformam vidas</title>

  <meta name="description"
    content="LUMEXI Angola: oportunidades de emprego, serviços digitais e soluções para empresas e empreendedores.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fundo: #090d19;
      --fundo2: #10172b;
      --painel: #151d35;
      --painel2: #1b2542;
      --azul: #3978ff;
      --roxo: #8155ff;
      --dourado: #e7c477;
      --texto: #f7f8ff;
      --suave: #aab4ce;
      --verde: #39d98a;
      --borda: rgba(255,255,255,.09);
      --sombra: 0 18px 55px rgba(0,0,0,.25);
      --raio: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background:
        radial-gradient(ellipse at 10% 0%, rgba(57,120,255,.12), transparent 35%),
        radial-gradient(ellipse at 90% 15%, rgba(129,85,255,.10), transparent 30%),
        var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button, .botao {
      cursor: pointer;
      transition: .2s ease;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .contentor {
      width: min(1120px, 92%);
      margin: auto;
    }

    .topo {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9,13,25,.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--borda);
    }

    .barra {
      min-height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .simbolo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: white;
      font-size: 17px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--azul), var(--roxo));
      box-shadow: 0 8px 25px rgba(80,100,255,.25);
    }

    .marca-texto {
      line-height: 1.2;
    }

    .marca-texto strong {
      display: block;
      font-size: 21px;
      letter-spacing: 1px;
    }

    .marca-texto small {
      color: var(--dourado);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--suave);
      font-size: 13px;
      font-weight: 700;
    }

    nav a:hover {
      color: var(--dourado);
    }

    .botao {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 19px;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
    }

    .botao:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .botao-principal {
      color: #fff;
      background: linear-gradient(110deg, var(--azul), var(--roxo));
      box-shadow: 0 9px 25px rgba(57,120,255,.18);
    }

    .botao-dourado {
      color: #171323;
      background: linear-gradient(110deg, #f2d99b, var(--dourado));
    }

    .botao-secundario {
      color: var(--texto);
      background: rgba(255,255,255,.04);
      border-color: var(--borda);
    }

    .botao-perigo {
      color: #ffb2b2;
      background: rgba(255,70,70,.08);
      border-color: rgba(255,70,70,.2);
    }

    .hero {
      padding: 88px 0 72px;
      overflow: hidden;
    }

    .hero-grelha {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 48px;
    }

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      margin-bottom: 22px;
      border: 1px solid rgba(231,196,119,.25);
      border-radius: 50px;
      color: var(--dourado);
      background: rgba(231,196,119,.06);
      font-size: 12px;
      font-weight: 800;
    }

    .ponto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 12px var(--verde);
    }

    h1 {
      font-size: clamp(37px, 5.3vw, 66px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 23px;
    }

    .destaque {
      color: var(--dourado);
    }

    .hero p {
      max-width: 590px;
      color: var(--suave);
      font-size: 17px;
      margin-bottom: 28px;
    }

    .acoes {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cartao-hero {
      padding: 29px;
      position: relative;
      border: 1px solid rgba(231,196,119,.18);
      border-radius: 28px;
      background:
        radial-gradient(circle at top right, rgba(129,85,255,.18), transparent 45%),
        linear-gradient(145deg, #17213b, #101626);
      box-shadow: var(--sombra);
    }

    .cartao-hero::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -25px;
      top: -25px;
      background: rgba(57,120,255,.12);
      filter: blur(30px);
      border-radius: 50%;
    }

    .cartao-hero h3 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .cartao-hero > p {
      font-size: 13px;
      margin-bottom: 23px;
    }

    .mini-cartao {
      padding: 17px;
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 12px;
      border-radius: 15px;
      border: 1px solid var(--borda);
      background: rgba(255,255,255,.035);
    }

    .mini-icone {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 13px;
      background: rgba(57,120,255,.15);
      font-size: 21px;
    }

    .mini-cartao strong {
      display: block;
      font-size: 14px;
    }

    .mini-cartao small {
      display: block;
      color: var(--suave);
      font-size: 12px;
    }

    .secao {
      padding: 74px 0;
    }

    .secao-alternada {
      background: rgba(255,255,255,.018);
      border-top: 1px solid rgba(255,255,255,.035);
      border-bottom: 1px solid rgba(255,255,255,.035);
    }

    .cabecalho-secao {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 38px;
    }

    .sobretitulo {
      color: var(--dourado);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
      font-size: 11px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.2;
      margin-bottom: 13px;
    }

    .cabecalho-secao p {
      color: var(--suave);
      font-size: 15px;
    }

    .grelha-servicos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

      border-radius: var(--raio);
