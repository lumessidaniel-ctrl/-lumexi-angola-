<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10152b">
  <meta name="description" content="LUMEXI Angola — oportunidades de emprego, negócios e mercado para transformar vidas.">
  <title>LUMEXI Angola | Oportunidades que transformam vidas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fundo: #10152b;
      --painel: #191f3d;
      --azul: #3978ff;
      --roxo: #8155ff;
      --texto: #ffffff;
      --suave: #b8c0dc;
      --verde: #39d98a;
      --borda: rgba(255,255,255,.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      background: rgba(16,21,43,.97);
      border-bottom: 1px solid var(--borda);
      padding: 16px 5%;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .cabecalho {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .marca {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .marca span {
      color: #6994ff;
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    nav a:hover {
      color: #8baaff;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 5%;
    }

    .hero {
      padding: 75px 5%;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(81,91,220,.3), transparent 65%),
        linear-gradient(135deg, #10152b, #1b1640);
    }

    .hero-conteudo {
      max-width: 850px;
      margin: auto;
    }

    .etiqueta {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid rgba(124,151,255,.5);
      border-radius: 30px;
      color: #c7d4ff;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 55px);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    h1 span {
      color: #8caaff;
    }

    .hero p {
      color: var(--suave);
      max-width: 700px;
      margin: 0 auto 25px;
    }

    .botao {
      display: inline-block;
      border: none;
      padding: 12px 19px;
      border-radius: 9px;
      background: linear-gradient(100deg, var(--azul), var(--roxo));
      color: white;
      font-weight: bold;
      margin: 5px 3px;
    }

    .botao:hover {
      opacity: .9;
    }

    .botao-secundario {
      background: transparent;
      border: 1px solid var(--borda);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: var(--suave);
      margin-bottom: 25px;
    }

    .grelha {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .cartao, .painel {
      background: var(--painel);
      border: 1px solid var(--borda);
      border-radius: 15px;
      padding: 23px;
    }

    .cartao h3 {
      margin: 10px 0;
    }

    .cartao p, .painel p {
      color: var(--suave);
      font-size: 14px;
    }

    .icone {
      font-size: 32px;
    }

    .secao {
      padding-top: 30px;
      padding-bottom: 30px;
    }

    .duas-colunas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 13px 0 5px;
      color: #e0e5ff;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      color: white;
      background: #10162f;
      border: 1px solid var(--borda);
      border-radius: 8px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #7194ff;
    }

    input::placeholder, textarea::placeholder {
      color: #8790ad;
    }

    select option {
      background: #10162f;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    form .botao {
      width: 100%;
      margin: 18px 0 0;
    }

    .mensagem {
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      background: #252e50;
      color: #dbe4ff;
      overflow-wrap: anywhere;
    }

    .mensagem:empty {
      display: none;
    }

    .sucesso {
      border: 1px solid #39d98a;
    }

    .erro {
      border: 1px solid #ff7777;
    }

    .anuncio {
      background: #111831;
      border: 1px solid var(--borda);
      padding: 18px;
      border-radius: 12px;
    }

    .anuncio h3 {
      margin-bottom: 8px;
    }

    .anuncio p {
      color: var(--suave);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 8px 0;
    }

    .categoria {
      display: inline-block;
      background: #293969;
      color: #dce5ff;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .oculto {
      display: none !important;
    }

    .conta-status {
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }

    .nota {
      font-size: 12px;
      color: var(--suave);
      margin-top: 12px;
    }
